# Configure the ABS API endpoint and a dedicated, high-entropy token.
# The token must match ABS_CONTROL_TOKEN on the ABS API service.
api:
  base-url: "https://your-abs-service.example.com"
  token: ""
  poll-seconds: 30

# If enabled, apply the configured skin to a matching online player on join
# and when the remote configuration changes.
skin:
  apply-on-join: true
  username: "ABS-Bot"
  enabled: false
  texture-url: ""
  model: "classic"

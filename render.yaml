services:
  - type: web
    name: abs-minecraft-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MC_HOST
        sync: false
      - key: MC_PORT
        value: "25565"
      - key: MC_USERNAME
        sync: false
      - key: MC_AUTH
        value: "offline"
      - key: MC_VERSION
        value: ""
      - key: RECONNECT_MS
        value: "5000"
      - key: RECONNECT_MAX_MS
        value: "60000"
      - key: RECONNECT_MULTIPLIER
        value: "2"
      - key: RECONNECT_JITTER
        value: "0.2"
      - key: WALK_INTERVAL_MS
        value: "1000"
      - key: MOVEMENT_MODE
        value: "forward"
      - key: JUMP_CHANCE
        value: "0.12"
